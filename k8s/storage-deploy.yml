apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-deployment
  namespace: datapumppu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-deployment
  template:
    metadata:
      labels:
        app: storage-deployment
    spec:
      containers:
        - name: storage
          image: acrdatapumppudevwesteurope.azurecr.io/storage:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 8080
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: storage-secret
                  key: DatabaseConnectionString
            - name: ServiceBus__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: storage-secret
                  key: ServiceBusConnectionString
            - name: ServiceBus__QueueName
              valueFrom:
                configMapKeyRef:
                  name: storage-configmap
                  key: ServiceBusQueueName
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
spec:
  selector:
    app: storage-deployment
  ports:
    - port: 8080
      targetPort: 8080
